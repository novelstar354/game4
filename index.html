<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="https://png.pngtree.com/png-clipart/20231017/original/pngtree-light-glowing-colorful-triangle-png-image_13329636.png" sizes="16×16" type="image/png" />   
<title>DODGE GAME</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#e5ecff;font-family:system-ui,-apple-system,Segoe UI}
  .wrap{display:grid;place-items:center;height:100%}
  canvas{background:#111a2e;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);touch-action:none}
  .hud{display:flex;gap:16px;margin-top:10px;font-size:14px;opacity:.9}
  .btns{display:flex;gap:10px;margin-top:10px}
  button{background:#1b2a4a;color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  .tip{opacity:.7;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <canvas id="game" width="420" height="640"></canvas>
    <div class="hud">
      <div>🏆 Score: <span id="score">0</span></div>
      <div>❤️ Lives: <span id="lives">3</span></div>
      <div>⭐ Best: <span id="best">0</span></div>
      <div>👑 Boss: <span id="bossHp">-</span></div>
    </div>
    <div class="btns">
      <button id="start">Start / Restart</button>
      <button id="pause">Pause</button>
    </div>
    <div class="tip">矢印とwasdで動かせます。｜スマホはドラッグ操作</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let running=false, paused=false;
let last=0, t=0, score=0;
let lives=3;

// ===== 画像 =====
const playerImg = new Image();
playerImg.src = 'https://www.illust-box.jp/db_img/sozai/00024/248413/watermark.jpg';

const enemyImg = new Image();
enemyImg.src = 'https://png.pngtree.com/png-clipart/20231017/original/pngtree-light-glowing-colorful-triangle-png-image_13329636.png';

const bossImg = new Image();
bossImg.src = 'https://thumb.ac-illust.com/6a/6a4cfa44b0fec725e875569dd97d60a1_t.jpeg';

const bigBulletImg = new Image();
bigBulletImg.src = 'https://media.istockphoto.com/id/817527326/ja/%E3%83%99%E3%82%AF%E3%82%BF%E3%83%BC/%E5%85%89%E3%81%AE%E5%8A%B9%E6%9E%9C.jpg?s=612x612&w=0&k=20&c=f0uyBsOW0cezsxoTD3H_eVm2lfpxVZy9I78YbwPFdNw=';

// ゲームオーバー画像（差し替え可）
const gameOverImg = new Image();
gameOverImg.src = 'https://thumb.photo-ac.com/02/02226ab7ac89874bc9526fb23e7769e7_t.jpeg';


document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'l') {
    alert("くそっやられた");
    lives += 10;
    score += 4000;
  }
});


document.addEventListener("keydown", e => {
  if (e.key === "r") reset();
  if (e.key === "p") paused = !paused;
});



// ===== オブジェクト =====
const player = {
  x: W/2,
  y: H-80,
  r: 8,
  speed: 3.6,
  slowSpeed: 1.6 // ← 追加
};

const bullets=[];
const bigBullets=[];
let boss=null;
let touch=null;
const keys={};

function reset(){
  bullets.length=0;
  bigBullets.length=0;
  boss=null;
  t=0;
  score=0;
  lives=3;
  player.x=W/2;
  player.y=H-80;
  running=true;
  paused=false;
  last=performance.now();

  bestSpan.textContent = bestScore; // 念のため
}


function spawnNormal(){
  bullets.push({x:Math.random()*W,y:-10,vx:0,vy:3,r:6});
}

function spawnBoss(){ 
    boss={x:W/2,y:100,hp:300,dir:1,cd:0};
}

function bossAttack(){
  const n=8;
  for(let i=0;i<n;i++){
    const a=(Math.PI*2/n)*i;
    bigBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,r:22});
  }
}

function update(dt){
  t+=dt; score+=Math.floor(dt*80);
  scoreSpan.textContent=score;
  livesSpan.textContent=lives;
  bossHp.textContent=boss?boss.hp:'-';

  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a'])dx--;
  if(keys['ArrowRight']||keys['d'])dx++;
  if(keys['ArrowUp']||keys['w'])dy--;
  if(keys['ArrowDown']||keys['s'])dy++;
  if(touch){ dx=touch.x-player.x; dy=touch.y-player.y; }
 const l = Math.hypot(dx, dy) || 1;
const spd =
  keys["Shift"] || keys["ShiftLeft"] || keys["ShiftRight"]
    ? player.slowSpeed
    : player.speed;


player.x += dx / l * spd;
player.y += dy / l * spd;

  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));

  if(!boss && Math.random()>0.40) spawnNormal();
  if(!boss && t>4000000000000000000000000000000) spawnBoss();

  bullets.forEach(b=>b.y+=b.vy);
  for(let i=bullets.length-1;i>=0;i--){ if(bullets[i].y>H+20) bullets.splice(i,1); }

  if(boss){
    boss.x+=boss.dir*1.2;
    if(boss.x<60||boss.x>W-60) boss.dir*=-1;
    boss.cd-=dt;
    if(boss.cd<=0){ bossAttack(); boss.cd=2.2;}
  }

  bigBullets.forEach(b=>{b.x+=b.vx; b.y+=b.vy;});

  const hit=b=>Math.hypot(b.x-player.x,b.y-player.y)<b.r+player.r;
  if(bullets.some(hit)||bigBullets.some(hit)){
    lives--; bullets.length=0; bigBullets.length=0;
    if (lives <= 0) {
  running = false;

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("bestScore", bestScore);
    bestSpan.textContent = bestScore;
  }
}

  }
}

function draw(){
  ctx.fillStyle='#0e1630'; ctx.fillRect(0,0,W,H);

  bullets.forEach(b=>ctx.drawImage(enemyImg,b.x-12,b.y-12,24,24));
  bigBullets.forEach(b=>ctx.drawImage(bigBulletImg,b.x-24,b.y-24,48,48));
  if(boss) ctx.drawImage(bossImg,boss.x-48,boss.y-48,96,96);
  ctx.drawImage(playerImg,player.x-16,player.y-16,32,32);

  if(!running){
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(0,0,W,H);
    ctx.drawImage(gameOverImg,W/2-150,H/2-120,300,200);
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='16px system-ui';
    ctx.fillText('Score: '+score,W/2,H/2+110);
    ctx.fillText('Startで再挑戦',W/2,H/2+135);
  }
}

function loop(now){
  requestAnimationFrame(loop);
  if(!running||paused){ draw(); return; }
  const dt=Math.min(0.033,(now-last)/1000);
  last=now; update(dt); draw();
}

const scoreSpan=document.getElementById('score');
const livesSpan=document.getElementById('lives');
const bossHp=document.getElementById('bossHp');

addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);

canvas.addEventListener('touchstart',e=>{
  const r=canvas.getBoundingClientRect();
  const t0=e.touches[0]; touch={x:t0.clientX-r.left,y:t0.clientY-r.top};
});
canvas.addEventListener('touchmove',e=>{
  const r=canvas.getBoundingClientRect();
  const t0=e.touches[0]; touch.x=t0.clientX-r.left; touch.y=t0.clientY-r.top;
});
canvas.addEventListener('touchend',()=>touch=null);

start.onclick=reset;
pause.onclick=()=>paused=!paused;

requestAnimationFrame(loop);

let touchTimer = null;




document.addEventListener("touchend", () => {
    clearTimeout(touchTimer);
});

const gesture = ["tl","tr","br","bl"];
let input = [];
let timer = null;

document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    const x = t.clientX;
    const y = t.clientY;
    const w = window.innerWidth;
    const h = window.innerHeight;

    let area = "";
    if (x < w*0.3 && y < h*0.3) area = "tl";
    else if (x > w*0.7 && y < h*0.3) area = "tr";
    else if (x > w*0.7 && y > h*0.7) area = "br";
    else if (x < w*0.3 && y > h*0.7) area = "bl";
    else return;

    input.push(area);

    clearTimeout(timer);
    timer = setTimeout(() => input = [], 5000);

    if (input.join() === gesture.join()) {
        alert("流石に天才すぎる");
        lives = 5000;
        input = [];
    }
});

let swipeCount = 0;
let startX = 0;

document.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
        startX = e.touches[0].clientX;
    }
});


    document.addEventListener("touchend", e => {
  if (e.touches.length === 0 && e.changedTouches.length >= 2) {
    swipeCount++;
    if (swipeCount === 3) {
      alert("流石に天才すぎる");
      lives = 5000;
      swipeCount = 0;
    }
  }
});

       
let bestScore = Number(localStorage.getItem("bestScore") || 0);
const bestSpan = document.getElementById("best");
bestSpan.textContent = bestScore;

</script>
</body>
</html>
